# Auto-lint on every `git commit`. Install the hook once per clone:
#   pre-commit install
# Run it over the whole repo by hand with:
#   pre-commit run --all-files
#
# These are `local` hooks on purpose: they run the ruff and mypy already in
# this venv, so the editor, the terminal and the commit hook can never
# disagree about a version. The cost is that the venv must exist — which is
# the documented workflow anyway. Swap in astral-sh/ruff-pre-commit if you
# would rather pin the tools independently of the venv.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        # mypy needs the whole package to resolve imports, so ignore the
        # per-file arguments pre-commit passes and use files= in pyproject.
        pass_filenames: false
        require_serial: true
